name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Quellcode entpacken
        run: |
          if [ ! -d bluey-android ] || git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^bluey-android.zip$'; then
            rm -rf bluey-android
            unzip -q bluey-android.zip
            git config user.name "bluey-bot"
            git config user.email "bluey-bot@users.noreply.github.com"
            git add -A bluey-android
            git diff --cached --quiet || git commit -m "Quellcode entpackt"
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: bluey-android
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Bluey APK ${{ github.run_number }}
          files: bluey-android/app/build/outputs/apk/debug/app-debug.apk
